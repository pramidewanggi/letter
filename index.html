</div></div><script>const $=id=>document.getElementById(id);
function fit(){var s=Math.min(innerWidth/390,innerHeight/844);$('stage').style.transform='translate(-50%,-50%) scale('+s+')'}
fit();addEventListener('resize',fit);
var Q=["Add your words of wisdom in quotes.json"];
var code=(new URLSearchParams(location.search).get('to')||'').toLowerCase();
fetch('quotes.json').then(function(r){return r.json()}).then(function(d){if(Array.isArray(d)&&d.length)Q=d}).catch(function(){});
fetch('letters.json').then(function(r){return r.json()}).then(function(L){var l=L[code]||L['default'];if(l){$('nm').textContent='To '+l.name;$('msg').textContent=l.message}}).catch(function(){});
